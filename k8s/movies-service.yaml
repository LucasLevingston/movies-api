apiVersion: v1
kind: ConfigMap
metadata:
  name: movies-service-config
  namespace: movies-api
data:
  GRPC_PORT: "50051"
  MONGODB_URI: "mongodb://mongodb:27017"
  RABBITMQ_URI: "amqp://guest:guest@rabbitmq:5672/"
  STORAGE_BACKEND: "mongodb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-service
  namespace: movies-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movies-service
  template:
    metadata:
      labels:
        app: movies-service
    spec:
      containers:
        - name: movies-service
          image: movies-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: movies-service-config
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: movies-service
  namespace: movies-api
spec:
  selector:
    app: movies-service
  ports:
    - port: 50051
      targetPort: 50051
